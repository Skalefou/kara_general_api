services:
  postgres:
    image: 'postgres:18.2'
    restart: 'no'
    container_name: kara-db
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - '5432:5432'
  redis:
    image: 'redis:8.2.7'
    restart: 'no'
    container_name: kara-redis
    ports:
      - '6379:6379'
  rabbitmq:
    image: 'rabbitmq:4-management'
    restart: 'no'
    container_name: kara-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: