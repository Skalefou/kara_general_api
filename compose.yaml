services:
  postgres:
    image: 'postgres:18.2'
    restart: 'no'
    container_name: kara-db
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - '5432:5432'
  redis:
    image: 'redis:8.2.7'
    restart: 'no'
    container_name: kara-redis
    ports:
      - '6379:6379'
  rabbitmq:
    image: 'rabbitmq:4-management'
    restart: 'no'
    container_name: kara-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
  image-worker:
    build:
      context: ../kara-image-worker
    container_name: kara-image-worker
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    # Secrets S3 (clés HMAC GCS) + limites/retry viennent du .env du worker.
    env_file:
      - ../kara-image-worker/.env
    # À l'intérieur du réseau compose, le broker est joignable par son nom de
    # service `rabbitmq` (le localhost du .env ne vaut que hors conteneur).
    environment:
      RABBITMQ_URL: 'amqp://guest:guest@rabbitmq:5672/%2f'
    # Les ports 91xx côté hôte sont pris par l'outillage Dart/Flutter en local
    # (un port par session `flutter run`) : on publie les métriques sur 19100.
    ports:
      - '19100:9100'

volumes:
  postgres_data: