spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: never

# Deep links de partage de cagnotte : domaine public réel en production (jamais de slash final).
app:
  public-link-base-url: ${APP_PUBLIC_LINK_BASE_URL:https://link.karapi.fr}

# Actuator / observability — production.
# Only health, info and prometheus are exposed; every other actuator endpoint stays off.
# Public reachability is further restricted by Caddy (403 on /actuator*) and the host firewall
# (port 8080 is never open to the Internet). Prometheus scrapes /actuator/prometheus over the
# internal Docker network only.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # Enables the liveness/readiness probe groups (/actuator/health/liveness, /readiness).
      probes:
        enabled: true
  metrics:
    tags:
      # Stamped on every metric so Prometheus/Grafana can filter by application.
      application: kara-general-api
  prometheus:
    metrics:
      export:
        enabled: true