spring.application.name=kara_general_api
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=dev

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Téléversement d'images : plafond aligné sur la politique applicative (5 Mo)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Stripe (paiement « payer tout »). Secrets fournis par l'environnement ; jamais logués.
kara.stripe.secret-key=${STRIPE_SECRET_KEY:}
kara.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
kara.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
# Version d'API Stripe attendue par le SDK MOBILE (flutter_stripe), utilisée pour sceller la clé éphémère
# du PaymentSheet. Doit correspondre au SDK natif embarqué par flutter_stripe (à ajuster lors d'un bump).
# flutter_stripe 13.1.0 (stripe-ios 25.17.x) => 2020-08-27.
kara.stripe.mobile-api-version=${STRIPE_MOBILE_API_VERSION:2020-08-27}

# Reçus « Mes factures » : en-tête vendeur imprimé sur le PDF (reçu, pas une facture légale française).
# Valeurs par défaut = placeholders Kara ; surchargeables par variables d'environnement.
kara.invoice.seller.name=${INVOICE_SELLER_NAME:Kara SAS}
kara.invoice.seller.address=${INVOICE_SELLER_ADDRESS:1 rue de la Fête, 75001 Paris, France}
kara.invoice.seller.email=${INVOICE_SELLER_EMAIL:facturation@kara.example}

# Filtrage par fenêtre géographique (bbox) sur GET /api/v1/rooms
# Seuil de bascule salles/clusters ET plafond du mode salles (garde-fou : une bbox monde ne renvoie jamais tout)
kara.rooms.viewport.max-results=1000
# Taille de la grille de clustering (N×N cellules) quand la bbox dépasse le seuil
kara.rooms.viewport.cluster-grid-size=8
