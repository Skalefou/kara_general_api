spring.application.name=kara_general_api
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=dev

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Téléversement d'images : plafond aligné sur la politique applicative (5 Mo)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Filtrage par fenêtre géographique (bbox) sur GET /api/v1/rooms
# Seuil de bascule salles/clusters ET plafond du mode salles (garde-fou : une bbox monde ne renvoie jamais tout)
kara.rooms.viewport.max-results=1000
# Taille de la grille de clustering (N×N cellules) quand la bbox dépasse le seuil
kara.rooms.viewport.cluster-grid-size=8
