# CI/CD — build + tests sur main, publication de l'image sur tag "v*".
# Owner du contrat REST : cette image est poussée vers Artifact Registry (europe-west9).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']

# id-token: write requis pour l'authentification GCP via Workload Identity Federation (OIDC).
permissions:
  contents: read
  id-token: write

jobs:
  # Build + tests unitaires/intégration (JUnit + Testcontainers).
  # Docker est disponible sur l'hôte ubuntu-latest : aucun bloc "services" nécessaire.
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & run tests
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests
          if-no-files-found: ignore

  # Construit et publie l'image Docker — uniquement sur un tag "v*", après des tests verts.
  docker:
    name: Build & Push image
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 pour disposer de l'historique complet (comparaison avec origin/main).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Garde-fou : on ne publie que des tags posés sur un commit présent dans main.
      - name: Verify tag on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag not on main"; exit 1; }

      # Authentification GCP via Workload Identity Federation (OIDC, sans clé JSON).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west9-docker.pkg.dev --quiet

      # Build multi-stage (Dockerfile racine) + push des tags "<version>" et "latest".
      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            europe-west9-docker.pkg.dev/karapi-ee1cd/kara-images/kara_general_api:${{ github.ref_name }}
            europe-west9-docker.pkg.dev/karapi-ee1cd/kara-images/kara_general_api:latest
