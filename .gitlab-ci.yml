image: eclipse-temurin:25-jdk

stages:
  - build

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  # Testcontainers (PostgreSQL) a besoin d'un daemon Docker accessible en CI
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  TESTCONTAINERS_HOST_OVERRIDE: "docker"
  TESTCONTAINERS_RYUK_DISABLED: "true"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/wrapper
    - .gradle/caches

build_and_test:
  stage: build
  services:
    - docker:24-dind
  script:
    - echo "FIREBASE_CREDENTIALS_BASE64 défini ? ${FIREBASE_CREDENTIALS_BASE64:+oui}"
    - echo "POSTGRES_HOST défini ? ${POSTGRES_HOST:+oui}"
    - ./gradlew build --console=plain
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/**/TEST-*.xml
    paths:
      - build/reports/tests
    expire_in: 1 week