# Prometheus scrape + alerting configuration for the Kara pre-prod monitoring stack.
# All targets are resolved by Docker DNS on the shared `kara_net` network (service hostnames).

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: preprod

# Alerting rules (thresholds live in alert-rules.yml).
rule_files:
  - /etc/prometheus/alert-rules.yml

# Route firing alerts to Alertmanager (also on kara_net).
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Spring Boot / Micrometer metrics. The API exposes /actuator/prometheus on 8080; only reachable
  # inside kara_net (Caddy returns 404 on /actuator* publicly, port 8080 is firewalled off).
  - job_name: kara-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api:8080
        labels:
          application: kara-general-api

  # PostgreSQL metrics (connections, pg_stat_statements, locks, ...).
  - job_name: postgres
    static_configs:
      - targets:
          - postgres_exporter:9187

  # Host metrics: CPU, RAM, disk, filesystem.
  - job_name: node
    static_configs:
      - targets:
          - node_exporter:9100

  # Prometheus self-monitoring.
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # Alertmanager self-monitoring.
  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
