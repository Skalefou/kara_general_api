# Promtail: discovers Docker containers via the Docker socket and ships their logs to Loki.
# Runs on the same host; reads /var/lib/docker/containers (mounted read-only).
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker service discovery: one target per running container.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # Container name (strip the leading "/").
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      # Compose service name, when present.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: compose_service
      # Compose project name, when present.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: compose_project
      # Static job label so all container logs are queryable as {job="docker"}.
      - target_label: job
        replacement: docker
